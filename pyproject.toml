[project]
name = "onus"
version = "0.1.0"
description = "A claim checker: extracts the verifiable claims in a deck or document and checks each against the evidence, with ruff-style rule codes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Scale Venture Partners" }]
keywords = ["fact-checking", "grounding", "claims", "linter", "pptx", "llm", "hallucination"]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing",
]
dependencies = [
  "pydantic>=2.6",
  "pydantic-ai-slim[anthropic]>=2.0",
  "python-pptx>=1.0",
  "python-docx>=1.1",
]

[project.urls]
Homepage = "https://github.com/scale-venture-partners/onus"
Issues = "https://github.com/scale-venture-partners/onus/issues"
Changelog = "https://github.com/scale-venture-partners/onus/blob/main/CHANGELOG.md"

[project.scripts]
onus = "onus.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:There is no current event loop:DeprecationWarning:pydantic_graph",
]

[tool.coverage.run]
source = ["onus"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", 'if __name__ == "__main__":']

[tool.mypy]
files = ["src"]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["onus", "conftest"]
